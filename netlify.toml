[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "site/netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/twilio-voice"
  to = "/.netlify/functions/twilio-voice"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
